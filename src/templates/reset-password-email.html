<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reset your password</title>
  </head>
  <body style="font-family: Arial, sans-serif; color: #2f2f37; line-height: 1.5">
    <h1>Password reset</h1>
    <p>Hello, {{name}}!</p>
    <p>
      We received a request to reset your password. Click the button below to
      choose a new one. This link is valid for 15 minutes.
    </p>
    <p>
      <a
        href="{{{link}}}"
        style="
          display: inline-block;
          padding: 12px 24px;
          background: #2f2f37;
          color: #ffffff;
          text-decoration: none;
          border-radius: 8px;
        "
        >Reset password</a
      >
    </p>
    <p>If you did not request a password reset, you can ignore this email.</p>
    <p>{{{link}}}</p>
  </body>
</html>
